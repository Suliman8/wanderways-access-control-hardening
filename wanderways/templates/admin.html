{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block page %}admin{% endblock %}
{% block content %}
<section class="card">
  <div class="card-head">
    <h1>Admin panel</h1>
    <a class="button" href="/api/admin/bookings/export">Export bookings (CSV)</a>
  </div>
  <div id="stats" class="stats"></div>
</section>

<section class="card">
  <h2>User accounts</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ID</th><th>Username</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th></tr></thead>
      <tbody id="users-body"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody>
    </table>
  </div>
</section>
{% endblock %}
